[project]
name = "mistral-document-ai-demo"
version = "0.1.0"
description = "Standalone demo: Mistral Document AI OCR via Microsoft Foundry REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "azure-identity>=1.17",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "streamlit>=1.38",
    "pandas>=2.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0"]
scripts = ["matplotlib>=3.8"]

[project.scripts]
extract = "src.extract:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
